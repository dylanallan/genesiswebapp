name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/*/index.ts scripts/ingest_data.ts
      - run: deno test --no-config --allow-env supabase/functions scripts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGOPTIONS: -c client_min_messages=warning
    steps:
      - uses: actions/checkout@v4
      - name: Migrations apply to a blank database and can be re-run
        run: scripts/test-migrations.sh
      - name: Privacy and payment checks
        run: |
          psql -qc "create database checks"
          psql -d checks -q -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stub.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            sed -E 's/create extension if not exists ("?vector"?)[^;]*;//Ig; s/extensions\.vector\(1536\)/extensions.vector/g; s/\bvector\(1536\)/extensions.vector/g' "$f" | psql -d checks -q -v ON_ERROR_STOP=1
          done
          out=$(psql -d checks -At -F ' | ' -f supabase/tests/rls_test.sql 2>&1; psql -d checks -At -F ' | ' -f supabase/tests/payments_test.sql 2>&1)
          echo "$out" | grep -E '\| (t|f)$|CHECK'
          if echo "$out" | grep -qE '\| f$|: FAIL'; then echo "A privacy or payment check failed"; exit 1; fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Every screen opens without crashing (simulated backend)
        run: npm run test:beta
