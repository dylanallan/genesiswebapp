name: Ingest data to knowledge base

# Manual only: loads the datasets listed in data/manifest.json (each with source and license).
# Needs repository secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and OPENAI_API_KEY.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run -A scripts/ingest_data.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
