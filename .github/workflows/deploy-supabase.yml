name: Deploy Supabase backend

# Applies database migrations and deploys every Edge Function when backend code reaches main.
# Add these repository secrets first (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency: deploy-supabase

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD as repository secrets."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: scripts/deploy-supabase.sh
